<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 1 — IMAX Vision</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        height: 100%;
        width: 100%;
        font-family: "Cinzel", serif;
    }

    #canvas {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
    }

    /* Moon & Sun */
    .planet {
        position: absolute;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        box-shadow: 0 0 60px rgba(255,255,255,0.7);
        filter: brightness(1.3);
        user-select: none;
    }

    #moon {
        top: 40px;
        left: 40px;
        background: radial-gradient(circle at 30% 30%, #ffffff, #cfcfcf, #9a9a9a);
        cursor: grab;
        z-index: 10;
    }

    #sun {
        top: -180px;
        right: -180px;
        background: radial-gradient(circle at 40% 40%, #fff7c0, #ffcc44, #ff8800);
        opacity: 0;
        filter: brightness(1.4);
        z-index: 5;
    }

    /* Message reveal */
    #message {
        position: absolute;
        bottom: 120px;
        width: 100%;
        text-align: center;
        font-size: 32px;
        color: #ffd87a;
        letter-spacing: 4px;
        opacity: 0;
        z-index: 20;
        text-shadow: 0 0 18px #ffddaa;
    }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="moon" class="planet"></div>
<div id="sun" class="planet"></div>

<div id="message">
    ON THIS CALM BIRTHDAY EVE SO NEW,<br>
    GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.
</div>

<script>
/* ------------------ CANVAS SETUP ------------------ */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

/* ------------------ STAR FIELD ------------------ */
let stars = [];
const STAR_COUNT = 220;

for (let i = 0; i < STAR_COUNT; i++) {
    stars.push({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        size: Math.random() * 1.2 + 0.3,
        tw: Math.random() * 0.015 + 0.002,
        fade: 1
    });
}

function drawStars() {
    stars.forEach(s => {
        const twinkle = (Math.sin(Date.now() * s.tw) + 1) / 2;
        ctx.fillStyle = `rgba(255,255,255,${twinkle * s.fade})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    });
}

/* ------------------ DRAG MOON ------------------ */
const moon = document.getElementById("moon");
const sun = document.getElementById("sun");
const message = document.getElementById("message");

let dragging = false;
let offsetX = 0, offsetY = 0;
let progress = 0;

moon.addEventListener("mousedown", e => {
    dragging = true;
    offsetX = e.clientX - moon.offsetLeft;
    offsetY = e.clientY - moon.offsetTop;
    moon.style.cursor = "grabbing";
});

addEventListener("mouseup", () => {
    dragging = false;
    moon.style.cursor = "grab";
});

addEventListener("mousemove", e => {
    if (!dragging) return;

    moon.style.left = (e.clientX - offsetX) + "px";
    moon.style.top = (e.clientY - offsetY) + "px";

    // Calculate drag progress (0 → 1)
    progress = Math.min(1, Math.max(0, (e.clientX / innerWidth)));

    // Fade stars
    stars.forEach(s => s.fade = 1 - progress);

    // Reveal message
    message.style.opacity = progress;

    // When fully revealed → fade moon and rise sun
    if (progress >= 1) {
        moon.style.transition = "1.8s ease";
        moon.style.opacity = 0;

        sunRise();
    }
});

/* ------------------ SUN RISE ------------------ */
function sunRise() {
    sun.style.transition = "2.5s ease-out";
    sun.style.opacity = 1;
    sun.style.top = "40px";
    sun.style.right = "40px";
}

/* ------------------ ANIMATE ------------------ */
function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawStars();
    requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
