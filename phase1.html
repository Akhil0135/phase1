<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMAX Cosmic — Phase 1</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: "Cinzel", serif;
}

/* Container */
#scene {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* Stars */
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  border-radius: 50%;
  opacity: 0;
  animation: twinkle 2.5s infinite ease-in-out;
}

@keyframes twinkle {
  0% { opacity: 0; }
  50% { opacity: 1; }
  100% { opacity: 0; }
}

/* Moon */
#moon {
  position: absolute;
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 120px;
  background: radial-gradient(circle, #fff, #ddd, #aaa);
  border-radius: 50%;
  opacity: 1;
  transition: opacity 3s ease;
}

/* Sun */
#sun {
  position: absolute;
  bottom: -200px;
  left: 50%;
  transform: translateX(-50%);
  width: 180px;
  height: 180px;
  background: radial-gradient(circle, #ffea95, #ffa600, #ff7300);
  border-radius: 50%;
  opacity: 0;
  transition: opacity 3s ease, bottom 5s ease;
}

/* Text */
#message {
  position: absolute;
  bottom: 10%;
  width: 100%;
  text-align: center;
  font-size: 28px;
  color: white;
  opacity: 0;
  transition: opacity 2s ease;
}
</style>
</head>
<body>

<div id="scene"></div>
<div id="moon"></div>
<div id="sun"></div>
<div id="message">Click to Start</div>

<script>
/* ---------------- STARS ----------------- */
const scene = document.getElementById("scene");

for (let i = 0; i < 120; i++) {
  let s = document.createElement("div");
  s.className = "star";
  s.style.top = Math.random() * 100 + "%";
  s.style.left = Math.random() * 100 + "%";
  s.style.animationDelay = (Math.random() * 3) + "s";
  scene.appendChild(s);
}

/* ------------ TRANSITION LOGIC ------------ */
let started = false;

document.body.onclick = () => {
  if (started) return;
  started = true;

  document.getElementById("message").style.opacity = 0;

  /* Fade moon */
  document.getElementById("moon").style.opacity = 0;

  /* Rise sun */
  setTimeout(() => {
    const sun = document.getElementById("sun");
    sun.style.opacity = 1;
    sun.style.bottom = "20%";
  }, 800);
};

/* Show "Click to Start" after load */
setTimeout(() => {
  document.getElementById("message").style.opacity = 1;
}, 800);
</script>

</body>
</html>
